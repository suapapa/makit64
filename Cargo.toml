[package]
edition      = "2024"
name         = "makit64"
rust-version = "1.95"
version      = "0.1.0"
authors      = ["Homin Lee <i@homin.dev>"]
description  = "ESP32-S3 HUB75E 64x64 LED matrix firmware (LED_metrix_mcu_ver_rev.1)"
license      = "MIT OR Apache-2.0"

[[bin]]
name = "makit64"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.2.0", features = ["esp32s3", "log-04", "unstable"] }
# Unlocks `#[ram(reclaimed)]` (dram2) for heap placement — same bootloader as
# `esp-bootloader-esp-idf`.
esp-hal-procmacros = { version = "0.23", features = ["__esp_idf_bootloader"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "multicast",
  "udp",
] }
embassy-sync = "0.8"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-ipv4",
  "socket-dhcpv4",
  "socket-udp",
] }
edge-mdns = { version = "0.8", default-features = false, features = ["io"] }
edge-nal-embassy = { version = "0.9", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-ipv4",
  "udp",
] }
edge-nal = "0.7"
coap-lite = { version = "0.13.3", default-features = false }
heapless = "0.8"
critical-section = "1.2.0"

esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

esp-hub75 = { version = "0.17.0", default-features = false, features = [
  "esp32s3",
  "log",
  "iram",
  "skip-black-pixels",
  "circular-dma",
  "trail-blank-4",
  "invert-blank",
  "invert-oe",
] }
embedded-graphics = "0.8.2"
static_cell = "2.1.1"

[build-dependencies]
dotenvy = "0.15"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
